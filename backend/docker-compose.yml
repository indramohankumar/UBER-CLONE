version: '3.8'

services:
  backend:
    build: .
    container_name: uber-backend-container
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:latest
    container_name: uber-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
